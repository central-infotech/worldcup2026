name: Update World Cup Results

# 試合開催期間中（6/11〜6/30、7/1〜7/19）UTC で 1 時間ごとに発火し、
# Wikipedia 側で更新されたスコアを取り込む。試合終了→Wikipedia 反映までに
# 数十分かかるので、毎時 :30 に走らせておけば結果が出てから 1 時間以内に
# 反映される。
# 以前は試合ごとに +2:30 のピンポイント cron を 92 個並べていたが、GitHub
# Actions は cron 数が増えるとスケジュール発火を落とす挙動があるため、
# 汎用 cron に集約した。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-results.yml"
      - "scripts/scrape_results.py"
  schedule:
    - cron: '30 * 11-30 6 *'
    - cron: '30 * 1-19 7 *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scripts/scrape_results.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/tournament.json)" ]]; then
            git add public/tournament.json
            git commit -m "chore: update match results $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "no changes"
          fi

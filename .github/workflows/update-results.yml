name: Update World Cup Results

# 各試合の開始時刻（UTC）から 2 時間 30 分後にスケジュール実行する。
# 試合が同時刻に始まる場合は1エントリにまとめている。
# 手動実行: workflow_dispatch
# プッシュ時: tournament.json をスケジュール変更したらワークフロー自身が更新される（cron も追従）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-results.yml"
      - "scripts/scrape_results.py"
